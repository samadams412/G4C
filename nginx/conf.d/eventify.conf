# Final config: HTTP->HTTPS redirect + TLS termination. Requires a certificate
# to already exist at /etc/letsencrypt/live/eventify.social/ — obtained using
# eventify.conf.bootstrap first. See docs/phase-writeups/phase-8-deployment-runbook.md.
server {
    listen 80;
    server_name eventify.social www.eventify.social;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name eventify.social www.eventify.social;

    ssl_certificate /etc/letsencrypt/live/eventify.social/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eventify.social/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Stripe webhooks go straight to the api container, not through the
    # Next.js app (which has no route for this path).
    location /webhooks/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
